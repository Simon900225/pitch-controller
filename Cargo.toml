[package]
name = "pitch-controller"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
directories = "6.0.0"
eframe = "0.35.0"
enigo = "0.6.1"
global-hotkey = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
